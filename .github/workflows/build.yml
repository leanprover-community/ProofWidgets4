on:
  push:
  pull_request:

name: ci

jobs:
  build:
    permissions:
      contents: write
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: ${{ matrix.shell || 'sh' }}
    strategy:
      matrix:
        include:
        - name: Build on Ubuntu
          os: ubuntu-latest
        # TODO: investigate why `lake build` deadlocks on macOS (issue #33)
        #- name: Build on macOS
        #  os: macos-latest
        - name: Build on Windows
          os: windows-latest
          shell: msys2 {0}
    steps:
      - name: Install MSYS2 (Windows)
        if: matrix.os == 'windows-latest'
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          path-type: inherit
          install: curl unzip

      - name: Install elan
        shell: bash
        run: |
          curl -sSfLO https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh
          chmod +x elan-init.sh
          ./elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - name: Build package
        run: lake --wfail build ProofWidgets

      - name: Check pre-built JS is up-to-date
        run: git diff --exit-code widget/js/

      - name: Try publishing @leanprover-community/proofwidgets4
        if: ${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-pre') && matrix.os == 'ubuntu-latest' }}
        continue-on-error: true
        run: cd widget/ && npm publish --access=public

      - name: Build demos
        run: lake --wfail build ProofWidgets.Demos

      - name: Run tests
        run: lake --wfail test

      - name: Create GitHub release for tag (Ubuntu)
        if: github.ref_type == 'tag' && matrix.os == 'ubuntu-latest'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          prerelease: ${{ contains(github.ref, '-pre') }}

    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
